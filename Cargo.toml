[package]
name = "logos-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
flate2 = "1.1.9"
regex = "1.12.4"
roxmltree = "0.21.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slint = "1.16.1"
unicode-normalization = "0.1.25"
ureq = "3.3.0"

[build-dependencies]
slint-build = "1.16.1"

[lib]
name = "logos_rs"
path = "src/lib.rs"

[[bin]]
name = "logos-rs"
path = "src/main.rs"

[[bin]]
name = "import"
path = "src/bin/import.rs"

[[bin]]
name = "import-docx"
path = "src/bin/import_docx.rs"

# Optimize dependencies (bundled SQLite, slint) even in dev for snappy iteration
[profile.dev.package."*"]
opt-level = 2
